<section class="footer-container">
  <div id="footer-particles"></div>

  <div class="footer-content">
    
    <div class="footer-grid">
      <!-- Column 1: Brand & Tagline -->
      <div class="footer-col brand-col">
        <h3>{{ site.username }}</h3>
        <p>{{ site.description }}</p>
        <p class="footer-location">
          <i class="fa fa-map-marker" aria-hidden="true"></i>
          {{ site.user_location }}
        </p>
      </div>

      <!-- Column 2: Explore (Links) -->
      <div class="footer-col links-col">
        <h4>Explore</h4>
        <div class="footer-nav">
          <a href="/about">About</a>
          <a href="/cv" target="_blank" rel="noopener noreferrer">CV</a>
          <a href="/research" class="wip-link" data-tooltip="System Updating...">Research</a>
          <a href="{{ site.lab_url | default: 'https://lab.maryamrezaee.me' }}" class="wip-link" data-tooltip="System Updating...">Academic Blog</a>
        </div>
      </div>

      <!-- Column 3: Connect (Icons) -->
      <div class="footer-col social-col">
        <h4>Connect</h4>
        <div class="footer-icons">
          <a aria-label="My Email" href="mailto:{{site.email}}" data-tooltip="Email"><i class="icon fa fa-envelope"></i></a>
          <a aria-label="My Telegram" target="_blank" rel="noopener noreferrer" href="https://telegram.me/{{site.telegram_username}}" data-tooltip="Telegram"><i class="icon fa fa-telegram" aria-hidden="true"></i></a>
          <a aria-label="My Github" target="_blank" rel="noopener noreferrer" href="https://github.com/{{site.github_username}}" data-tooltip="Github"><i class="icon fa fa-github-alt" aria-hidden="true"></i></a>
          <a aria-label="My Tumblr" target="_blank" rel="noopener noreferrer" href="{{ site.me_url | default: 'https://me.maryamrezaee.me' }}" data-tooltip="Tumblr"><i class="icon fa fa-tumblr" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p>&copy; {{ site.time | date: "%Y" }} {{site.username}}. All rights reserved.</p>
      <p>
        Designed by <a href="https://github.com/{{site.github_username}}" target="_blank" rel="noopener noreferrer">Maryam Rezaee</a>.<br>
        Inspired by the <a href="https://github.com/nrandecker/particle" target="_blank" rel="noopener noreferrer">Particle Theme</a> by Nathan Randecker.
      </p>
    </div>

  </div>
</section>
